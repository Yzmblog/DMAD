# DMAD distillation of MiniMax-H3 (text-to-audio-video) into a 4-step student.
# One node x 8 GPUs, FSDP2, batch size 1 per GPU, 768x1344, 124 frames at 24 fps.
# Replace every /path/to/... below (see README "Data preparation").

model:
    name: minimax_h3_t2av
    pretrained_model_name_or_path: /path/to/MiniMax-H3
    running_dtype: bf16
    transformer_param_dtype: bf16
    local_files_only: true
    patch_size: [1, 2, 2]
    video_latent_channels: 24
    audio_latent_channels: 32
    vae_spatial_scale_factor: 16
    attention_backend: null

distributed:
    backend: nccl
    timeout_minutes: 60
    sequence_parallel:
        enabled: false
        size: 1
    fsdp2:
        enabled: true
        size: ${oc.env:WORLD_SIZE,1}
        reshard_after_forward:
            root_reshard: false
            block_reshard: true
        mixed_precision:
            param_dtype: null
            reduce_dtype: fp32
            output_dtype: null
            cast_forward_inputs: false

training:
    method: minimax_h3_t2av_dmad
    max_train_iters: 8000
    gradient_accumulation_iters: 1
    gradient_checkpointing: true
    max_grad_norm: 0                    # 0 = no gradient clipping
    lr_scheduler: constant
    lr_warmup_iters: 0
    save_every_iters: 100
    save_total_limit: 8                 # older checkpoints are deleted
    output_dir: /path/to/output/dmad_minimax_h3_full_critic
    minimax_h3:
        video_flow_shift: 12.0
        audio_flow_shift: 2.0
        latent_dtype: fp32
    dmd:
        num_inference_steps: 4          # student evaluations per sample
        fake_update_ratio: 1            # critic updates per student update
        height: 768
        width: 1344
        num_frames: 124                 # must match the real-latent tier
        renoise_sigma_min: 0.02         # critic noise level: uniform in [min, max], then flow-shifted
        renoise_sigma_max: 0.98
    dmad:
        prompt_cache_dir: /path/to/prompt_cache                                  # data_process/encode_prompts.py
        real_latent_dir: /path/to/real_latents                                   # data_process/encode_real_videos.py
        real_caption_map: /path/to/ultravideo_prompts/ultravideo_index_to_clipid.jsonl  # data_process/build_prompt_list.py
        teacher_latent_dir: /path/to/teacher_latents                             # data_process/gen_teacher_data.py
        feature_block: 49               # critic features from the last transformer block
        critic_freeze_blocks: 25        # full critic: train transformer blocks [25:] (+ heads), freeze the refiner, embedders and blocks [:25]
        gap_tau: 2.0                    # temperature of the teacher-term routing
        ema_gammas: [6.94, 16.97]       # power-function EMAs of the student (sigma_rel ~0.10 and ~0.05)
        sample_num_prompts: 4           # visualization at every checkpoint (prompts 0..3 of the prompt cache)
    student:
        train_type: lora
        lora:
            rank: 128
            alpha: 128
            target_modules: [to_q, to_k, to_v, to_out.0, ff.net.0.proj, ff.net.2]
        optimizer:
            learning_rate: 4e-5
            adam_beta1: 0.0
            adam_beta2: 0.99
            weight_decay: 0.01
            adam_epsilon: 0.00000001
    fake:
        train_type: full                # full-parameter critic (dmad.critic_freeze_blocks above); the paper's run uses a LoRA critic
        optimizer:
            learning_rate: 4e-5
            adam_beta1: 0.0
            adam_beta2: 0.99
            weight_decay: 0.01
            adam_epsilon: 0.00000001

logging:
    rank_zero_only: true
    train_log_every_iters: 10

resume:
    auto_resume: true
